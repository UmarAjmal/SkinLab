<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice</title>
<style>
  @page { size: 80mm auto; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { margin: 0; padding: 0; height: auto; }
  body { background: #dcdcdc; font-family: "Segoe UI", Tahoma, Arial, sans-serif; color: #000;
         -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .receipt { width: 80mm; margin: 0 auto; padding: 2mm 3.5mm; background: #fff; font-size: 12px; line-height: 1.3; }
  .hide { display: none !important; }

  /* ---------- Header ---------- */
  .head { text-align: center; }
  .head img { width: 22mm; height: auto; display: block; margin: 0 auto; }
  .head h1 { font-size: 18px; font-weight: 800; line-height: 1.15; margin-top: 1.2mm; text-transform: uppercase; letter-spacing: .3px; }
  .head p { font-size: 11px; margin-top: .8mm; color: #222; }

  /* ---------- Invoice bar (black strip) ---------- */
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 2mm;
         margin-top: 3mm; padding: 1.6mm 2.5mm; background: #000; color: #fff; border-radius: 1.2mm; }
  .bar b { font-size: 13px; font-weight: 800; }
  .bar span { font-size: 10.5px; text-align: right; }

  /* ---------- Patient + token ---------- */
  .who { display: flex; gap: 3mm; margin-top: 3mm; align-items: stretch; }
  .who .left { flex: 1; min-width: 0; }
  .who .name { font-size: 16px; font-weight: 800; line-height: 1.15; word-break: break-word; }
  .kv { display: flex; gap: 2mm; font-size: 11.5px; margin-top: .7mm; }
  .kv i { font-style: normal; color: #555; width: 14mm; flex: none; }
  .kv span { font-weight: 600; min-width: 0; word-break: break-word; }
  .tok { flex: none; width: 24mm; background: #000; color: #fff; border-radius: 1.5mm; text-align: center;
         display: flex; flex-direction: column; justify-content: center; padding: 1.5mm 0; }
  .tok small { font-size: 10px; letter-spacing: 1px; }
  .tok strong { font-size: 26px; font-weight: 800; line-height: 1.05; }

  /* ---------- Dotted line (no border) ---------- */
  .dots { height: 1px; margin: 3mm 0 1mm; background-image: repeating-linear-gradient(90deg,#000 0 1px,transparent 1px 4px); }

  /* ---------- Items ---------- */
  .items-title { display: flex; justify-content: space-between; font-size: 11px; color: #555; padding-bottom: 1mm; }
  .item { padding: 1.4mm 0 1.6mm; background-image: repeating-linear-gradient(90deg,#000 0 1px,transparent 1px 4px);
          background-repeat: no-repeat; background-size: 100% 1px; background-position: bottom; }
  .item:last-child { background-image: none; }
  .item .n { font-size: 13px; font-weight: 700; word-break: break-word; }
  .item .note { font-size: 10.5px; color: #444; }
  .item .m { display: flex; justify-content: space-between; font-size: 11.5px; margin-top: .4mm; }
  .item .m em { font-style: normal; color: #444; }
  .item .m b { font-weight: 800; }

  .item .dealrow { display: flex; justify-content: space-between; gap: 2mm; font-size: 13px; font-weight: 800; }
  .item .dealrow span { min-width: 0; word-break: break-word; }
  .sub { margin-top: 1.2mm; padding-left: 1.5mm; }
  .sub .t { font-size: 11.5px; }
  .sub .t b { font-weight: 800; }
  .sub .s { font-size: 10px; color: #444; padding-left: 2.2mm; margin-bottom: .8mm; }

  /* ---------- Totals ---------- */
  .tot { margin-top: 1mm; }
  .tot .r { display: flex; justify-content: space-between; padding: .6mm 0; font-size: 12px; }
  .pay { display: flex; justify-content: space-between; align-items: center; margin: 1.5mm 0;
         padding: 1.8mm 2.5mm; background: #000; color: #fff; border-radius: 1.2mm; font-size: 15px; font-weight: 800; }
  .due { display: flex; justify-content: space-between; align-items: baseline; margin-top: .8mm; font-size: 15px; font-weight: 800; }
  .status { text-align: right; font-size: 10.5px; color: #333; margin-top: .3mm; }

  /* ---------- Footer ---------- */
  .thanks { text-align: center; font-style: italic; font-weight: 700; font-size: 12.5px; margin: 4mm 0 2mm; }
  .credit { text-align: center; font-size: 10px; line-height: 1.4; white-space: nowrap; }
  .credit b { font-weight: 800; }

  @media print {
    html, body { background: #fff; width: 80mm; }
    .receipt { margin: 0; width: 80mm; }
  }
</style>
</head>
<body>

<!-- Backend chahe to yahan JSON inject kar sakta hai (optional):
<script id="voucher-data" type="application/json">{ ...invoice json... }</script> -->
<script id="voucher-data" type="application/json"></script>

<div class="receipt" id="receipt">

  <div class="head">
    <img id="logo" alt="">
    <h1 id="clinicName"></h1>
    <p id="clinicLine"></p>
  </div>

  <div class="bar"><b id="inv"></b><span id="date"></span></div>

  <div class="who">
    <div class="left">
      <div class="name" id="patient"></div>
      <div class="kv" id="rPhone"><i>Phone</i><span id="pphone"></span></div>
      <div class="kv" id="rMr"><i>MR No</i><span id="mr"></span></div>
      <div class="kv" id="rVisit"><i>Visit No</i><span id="visit"></span></div>
      <div class="kv" id="rRef"><i>Ref by</i><span id="ref"></span></div>
    </div>
    <div class="tok" id="tokBox"><small>Token</small><strong id="token"></strong></div>
  </div>

  <div class="dots"></div>
  <div class="items-title"><span>Item</span><span>Amount</span></div>
  <div id="items"></div>
  <div class="dots" style="margin-top:1mm"></div>

  <div class="tot">
    <div class="r"><span>Gross total</span><span id="gross"></span></div>
    <div class="r" id="rDisc"><span>Discount</span><span id="discount"></span></div>
    <div class="r" id="rRem"><span>Remaining</span><span id="remaining"></span></div>
    <div class="pay"><span>Payable</span><span id="payable"></span></div>
    <div class="r"><span>Paid</span><span id="paid"></span></div>
    <div class="due"><span>Balance due</span><span id="balance"></span></div>
    <div class="status" id="status"></div>
  </div>

  <div class="thanks" id="thanks"></div>

  <div class="credit">
    Software Solution by <b>Falcon Swift Pvt. Ltd.</b><br>
    www.falconswift.online &nbsp;|&nbsp; 0320-8024173
  </div>

</div>

  const m = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()];
  let h = d.getHours(); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
  return String(d.getDate()).padStart(2,"0") + "-" + m + "-" + d.getFullYear() + " " +
         String(h).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0") + " " + ap;
}

/* Software ka JSON kisi bhi naam ke fields se aaye, yahan ek jaisa ban jata hai.
   Apke field names alag hon to bas yahan keys add kar dein. */
function normalize(raw) {
  const c = raw.clinic || raw.branch || raw.company || {};
  const p = raw.patient || raw.customer || {};
  const isObj = typeof p === "object";
  const list = raw.items || raw.products || raw.services || raw.lines || [];
  return {
    clinic: {
      name: pick(c, "name", "clinic_name") || pick(raw, "clinic_name", "clinicName"),
      address: pick(c, "address") || pick(raw, "clinic_address"),
      phone: pick(c, "phone", "contact") || pick(raw, "clinic_phone"),
      logo: pick(c, "logo", "logo_url") || pick(raw, "logo"),
      thanks: pick(c, "thanks", "footer_message") || pick(raw, "thanks", "footer_message")
    },
    invoice: pick(raw, "invoice_no", "invoiceNo", "invoice", "inv", "number"),
    date: fmtDate(pick(raw, "date", "created_at", "createdAt", "invoice_date")),
    patient: isObj ? pick(p, "name", "full_name") : p || pick(raw, "patient_name", "customer_name"),
    patientPhone: isObj ? pick(p, "phone", "mobile") : pick(raw, "patient_phone", "phone"),
    mr: pick(raw, "mr_no", "mrNo", "mr"),
    visit: pick(raw, "visit_no", "visitNo", "visit"),
    refBy: pick(raw, "ref_by", "refBy", "referred_by", "doctor"),
    token: pick(raw, "token", "token_no", "tokenNo"),
    items: list.map(i => {
      const kids = pick(i, "children", "sub_items", "subItems", "package_items", "deal_items") || [];
      const deal = !!pick(i, "is_deal", "isDeal") || pick(i, "type") === "deal" || kids.length > 0;
      return {
        name: pick(i, "name", "title", "service", "product"),
        deal,
        qty: num(pick(i, "qty", "quantity")) || 1,
        price: num(pick(i, "price", "rate", "unit_price", "unitPrice")),
        note: pick(i, "note", "description"),
        children: kids.map(k => {
          const bundled = num(pick(k, "bundled", "total_sessions", "totalSessions", "total"));
          const consumed = num(pick(k, "consumed", "used"));
          const leftRaw = pick(k, "left", "remaining");
          const left = leftRaw === "" ? Math.max(bundled - consumed, 0) : num(leftRaw);
          const sess = pick(k, "session_no", "sessionNo", "session", "current_session");
          return { name: pick(k, "name", "title", "service"), bundled, consumed, left, session: sess === "" ? consumed : num(sess) };
        })
      };
    }),
    remaining: pick(raw, "total_remaining", "patient_remaining", "remaining_balance", "previous_due", "remaining"),
    discount: num(pick(raw, "discount")),
    paid: num(pick(raw, "paid", "paid_amount", "received"))
  };
}

/* =========================================================
   Render
   ========================================================= */
function render(d) {
  const logo = d.clinic.logo || CONFIG.defaultLogo;
  if (logo) $("logo").src = logo; else toggle("logo", false);

  setText("clinicName", d.clinic.name);
  setText("clinicLine", [d.clinic.address, d.clinic.phone].filter(Boolean).join("  |  "));
  setText("inv", d.invoice ? "Invoice " + d.invoice : "");
  setText("date", d.date);

  setText("patient", d.patient);
  setText("pphone", d.patientPhone); toggle("rPhone", !!d.patientPhone);
  setText("mr", d.mr);               toggle("rMr", !!d.mr);
  setText("visit", d.visit);         toggle("rVisit", !!d.visit);
  setText("ref", d.refBy);           toggle("rRef", !!d.refBy);
  setText("token", d.token);         toggle("tokBox", !!d.token);

  let gross = 0;
  $("items").innerHTML = "";
  d.items.forEach(it => {
    const line = it.qty * it.price; gross += line;
    const row = document.createElement("div"); row.className = "item";
    if (it.deal) {
      const h = document.createElement("div"); h.className = "dealrow";
      const a = document.createElement("span"); a.textContent = it.name + (/\(deal\)/i.test(it.name) ? "" : " (Deal)");
      const b = document.createElement("span"); b.textContent = money(line);
      h.append(a, b); row.appendChild(h);
      it.children.forEach(k => {
        const sub = document.createElement("div"); sub.className = "sub";
        const t1 = document.createElement("div"); t1.className = "t";
        const nm = document.createElement("b"); nm.textContent = k.name;
        t1.append("\u2022 ", nm, ": Session " + k.session + " of " + k.bundled + " (" + k.left + " Remaining)");
        const t2 = document.createElement("div"); t2.className = "s";
        t2.textContent = "Bundled: " + k.bundled + " | Consumed: " + k.consumed + " | Left: " + k.left;
        sub.append(t1, t2); row.appendChild(sub);
      });
    } else {
      const n = document.createElement("div"); n.className = "n"; n.textContent = it.name;
      if (it.note) { const s = document.createElement("div"); s.className = "note"; s.textContent = it.note; n.appendChild(s); }
      const m = document.createElement("div"); m.className = "m";
      const e = document.createElement("em"); e.textContent = it.qty + " x " + money(it.price);
      const b = document.createElement("b"); b.textContent = money(line);
      m.append(e, b); row.append(n, m);
    }
    $("items").appendChild(row);
  });

  const payable = gross - d.discount, balance = payable - d.paid;
  setText("gross", money(gross));
  setText("discount", "(" + money(d.discount) + ")"); toggle("rDisc", d.discount > 0);
  setText("remaining", "PKR " + num(d.remaining).toFixed(2)); toggle("rRem", d.remaining !== "");
  setText("payable", money(payable) + "/-");
  setText("paid", money(d.paid));
  setText("balance", money(Math.max(balance, 0)));
  setText("status", balance <= 0 ? "Fully paid" : d.paid > 0 ? "Partially paid" : "Unpaid");
  setText("thanks", d.clinic.thanks || CONFIG.thanks);

  const go = CONFIG.autoPrint || new URLSearchParams(location.search).get("print") === "1";
  if (go) {
    const img = $("logo");
    const doPrint = () => setTimeout(() => window.print(), 150);
    (img.complete || !img.src) ? doPrint() : (img.onload = img.onerror = doPrint);
  }
}

/* Software direct bhi call kar sakta hai:  renderVoucher(jsonObject)  */
window.renderVoucher = raw => render(normalize(raw));

async function init() {
  let raw = null;
  const emb = $("voucher-data").textContent.trim();
  if (emb) { try { raw = JSON.parse(emb); } catch (e) { console.error("voucher-data JSON error", e); } }

  if (!raw && CONFIG.apiUrl) {
    const id = new URLSearchParams(location.search).get("id");
    try {
      const res = await fetch(CONFIG.apiUrl.replace("{id}", encodeURIComponent(id || "")), { headers: CONFIG.headers });
      if (!res.ok) throw new Error("HTTP " + res.status);
      raw = await res.json();
    } catch (e) { console.error("Voucher fetch failed:", e); }
  }
  render(normalize(raw || DEMO));
}
init();
</script>
